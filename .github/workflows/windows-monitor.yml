name: Build Batch Buddy Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - 'batch_monitor*.py'
      - 'batch_history.py'
      - 'apns_live_activity.py'
      - 'assets/batchbuddy.ico'
      - 'requirements.txt'
      - '.github/workflows/windows-monitor.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build desktop executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon assets/batchbuddy.ico --add-data "assets/batchbuddy.ico;assets" --name BatchBuddyMonitor batch_monitor_desktop_qt.py
      - uses: actions/upload-artifact@v4
        with:
          name: BatchBuddyMonitor-windows
          path: dist/BatchBuddyMonitor.exe
          retention-days: 14
