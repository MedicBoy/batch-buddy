name: BatchBuddy
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  PusherSwift:
    url: https://github.com/pusher/pusher-websocket-swift
    from: 10.0.0
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
targets:
  BatchBuddy:
    type: application
    platform: iOS
    sources: [BatchBuddy]
    dependencies:
      - target: BatchBuddyWidget
        embed: true
      - target: BatchBuddyBroadcast
        embed: true
      - package: PusherSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batchbuddy.advisor
        PRODUCT_NAME: BatchBuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 11

  BatchBuddyWidget:
    type: app-extension
    platform: iOS
    sources:
      - BatchBuddyWidget
      - BatchBuddy/BatchBuddyAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batchbuddy.advisor.widget
        PRODUCT_NAME: BatchBuddyWidget
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 11
    info:
      path: BatchBuddyWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BatchBuddyWidgetBundle

  BatchBuddyBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - BatchBuddyBroadcast
      - BatchBuddy/BatchBuddyAttributes.swift
      - BatchBuddy/OfferAdvisor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batchbuddy.advisor.broadcast
        PRODUCT_NAME: BatchBuddyBroadcast
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 11
    info:
      path: BatchBuddyBroadcast/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler

schemes:
  BatchBuddy:
    build:
      targets:
        BatchBuddy: all
